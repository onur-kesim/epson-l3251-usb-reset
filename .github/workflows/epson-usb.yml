name: epson-usb

# Acceptance criteria K1-K4: see KRITER.md; K5-K6: see KRITER_0.1.1.md (both
# frozen before any code).
#
# Runs on EVERY push on EVERY branch (no branch filter), so the throw-away
# branches `mutant/k2-upstream-skip` and `mutant/k5-pyusb-mandatory` get a run
# too, and on pull requests.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The host program the seven upstream-bridge test classes need. It is not on
  # PyPI and has no setup.py / pyproject.toml, so
  #   pip install git+https://github.com/Ircama/epson_print_conf@<sha>
  # fails ("neither 'setup.py' nor 'pyproject.toml' found", measured
  # 24 Sep 2026). It is checked out at the exact commit and put on PYTHONPATH.
  UPSTREAM_SHA: 1ef15558fdfac0801aa7e2445c8ffb17444446ec

jobs:
  epson-usb:
    name: epson-usb (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Both versions always run to the end: a red 3.9 must not hide 3.10.
      fail-fast: false
      matrix:
        # K6: 3.9 is the lowest version the package declares, so it is the one
        # that has to be green. It is NOT allowed to be skipped: if the host
        # program cannot be installed on 3.9, the 3.9 job is red and K6 has failed.
        python-version: ["3.9", "3.10"]
    defaults:
      run:
        shell: bash     # -eo pipefail, so `cmd | tee log` fails when cmd fails
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check out epson_print_conf at the pinned commit
        uses: actions/checkout@v7
        with:
          repository: Ircama/epson_print_conf
          ref: ${{ env.UPSTREAM_SHA }}
          path: upstream

      - name: Install the host program's requirements
        run: python -m pip install -r upstream/requirements.txt

      - name: The package under test is THIS repository's, not the host's copy
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
        run: |
          python - <<'PY'
          import os, epson_usb
          here = os.path.realpath(epson_usb.__file__)
          expected = os.path.join(os.path.realpath(os.environ["GITHUB_WORKSPACE"]), "epson_usb") + os.sep
          print("epson_usb imported from:", here)
          assert here.startswith(expected), "shadowed by another epson_usb: " + here
          PY

      # K1: Ran >= 66, skipped = 0, exit 0.
      - name: K1 - full suite, nothing skipped
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
          EPSON_USB_REQUIRE_UPSTREAM: "1"
        run: |
          python -m unittest discover -s epson_usb/tests -t . 2>&1 | tee unittest.log
          python - <<'PY'
          import re
          log = open("unittest.log", encoding="utf-8").read()
          m = re.search(r"^Ran (\d+) tests? in ", log, re.M)
          assert m, "no 'Ran N tests' line in the output"
          ran = int(m.group(1))
          assert ran >= 66, "Ran %d tests, need >= 66" % ran
          assert not re.search(r"skipped=\d+", log), "some tests were skipped"
          print("K1: Ran %d tests, skipped 0" % ran)
          PY

      # K2 evidence is the red run on branch `mutant/k2-upstream-skip`.
      # This step proves the same gate on every run: hide the host program and
      # the suite must fail (it used to read "OK (skipped=7)" instead).
      - name: K2 self-check - without the host program the suite must go red
        env:
          EPSON_USB_REQUIRE_UPSTREAM: "1"
        run: |
          set +e
          PYTHONPATH= python -m unittest discover -s epson_usb/tests -t . > k2.log 2>&1
          rc=$?
          set -e
          tail -6 k2.log
          test "$rc" -ne 0
          grep -q "EPSON_USB_REQUIRE_UPSTREAM=1: refusing to skip" k2.log
          echo "K2 self-check: suite exit code $rc without the host program (red, as required)"

      # K3: 2/2 mutants caught, exit 0.
      - name: K3 - mutant proof (2/2 mutants must be caught)
        env:
          PYTHONPATH: ${{ github.workspace }}/upstream
          EPSON_USB_REQUIRE_UPSTREAM: "1"
        run: |
          python epson_usb/tests/mutant_run.py 2>&1 | tee mutant.log
          test "$(grep -c 'red (caught)' mutant.log)" -eq 2
          grep -q "OK: every mutant was caught, every file restored" mutant.log
          git diff --exit-code    # the script must leave tracked files byte-identical
          echo "K3: 2/2 mutants caught"

      # K4: the wheel, installed in a clean venv, imports and says MIT.
      - name: K4 - wheel in a clean venv, import works, licence is MIT
        run: |
          python -m pip install build
          python -m build
          python -m venv "$RUNNER_TEMP/k4"
          "$RUNNER_TEMP/k4/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"    # leave the checkout so the source tree cannot shadow the wheel
          "$RUNNER_TEMP/k4/bin/python" - <<'PY'
          import importlib.metadata as md
          import epson_usb
          meta = md.metadata("epson-usb")
          licence = meta.get("License-Expression") or meta.get("License")
          print("epson_usb", epson_usb.__version__, "from", epson_usb.__file__)
          print("licence:", licence)
          assert "site-packages" in epson_usb.__file__, "not imported from the installed wheel"
          assert licence == "MIT", "licence metadata is %r, expected 'MIT'" % licence
          print("K4: import works, licence MIT")
          PY

      # K5: PyUSB is an optional extra in the wheel's metadata, and in practice.
      # `pip install epson-usb` must not install it, `pip install
      # "epson-usb[pyusb]"` must. The evidence that this gate can go red is the
      # run on branch `mutant/k5-pyusb-mandatory` (`dependencies = ["pyusb"]`
      # put back).
      - name: K5 - PyUSB only through the [pyusb] extra
        run: |
          wheel=$(realpath dist/*.whl)
          python - "$wheel" <<'PY'
          import email, re, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              name = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")][0]
              meta = email.message_from_string(z.read(name).decode("utf-8"))
          requires = meta.get_all("Requires-Dist") or []
          print("Requires-Dist: ", requires)
          print("Provides-Extra:", meta.get_all("Provides-Extra"))
          pyusb = [r for r in requires if re.match(r"pyusb\b", r, re.I)]
          assert pyusb, "no Requires-Dist for pyusb: the [pyusb] extra would install nothing"
          for r in pyusb:
              assert re.search(r'''extra\s*==\s*["']pyusb["']''', r), "PyUSB is required without the extra: " + r
          assert "pyusb" in (meta.get_all("Provides-Extra") or []), "no Provides-Extra: pyusb"
          print("K5 metadata: Requires-Dist pyusb only under extra == pyusb")
          PY

          # Without the extra: PyUSB is not installed and the import works.
          python -m venv "$RUNNER_TEMP/k5-plain"
          "$RUNNER_TEMP/k5-plain/bin/pip" install "$wheel"
          if "$RUNNER_TEMP/k5-plain/bin/pip" show pyusb > /dev/null 2>&1; then
            echo "K5 FAILED: 'pip install epson-usb' installed PyUSB"; exit 1
          fi
          cd "$RUNNER_TEMP"    # leave the checkout so the source tree cannot shadow the wheel
          "$RUNNER_TEMP/k5-plain/bin/python" - <<'PY'
          import importlib.util
          import epson_usb
          assert "site-packages" in epson_usb.__file__, "not imported from the installed wheel"
          assert importlib.util.find_spec("usb") is None, "PyUSB (import name 'usb') is importable"
          print("K5 plain install: epson_usb imports, PyUSB absent")
          PY

          # With the extra: PyUSB is installed.
          python -m venv "$RUNNER_TEMP/k5-extra"
          "$RUNNER_TEMP/k5-extra/bin/pip" install "${wheel}[pyusb]"
          "$RUNNER_TEMP/k5-extra/bin/python" - <<'PY'
          import importlib.metadata as md
          import epson_usb, usb
          print("epson_usb", epson_usb.__version__, "+ pyusb", md.version("pyusb"))
          print("K5 extra install: PyUSB present")
          PY

      # K6: the declared floor is 3.9. This job (3.9) passing K1 and K3 above is
      # the other half; here the wheel's own metadata is checked.
      - name: K6 - the wheel says Requires-Python >=3.9
        run: |
          python - "$(realpath dist/*.whl)" <<'PY'
          import email, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              name = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")][0]
              meta = email.message_from_string(z.read(name).decode("utf-8"))
          assert meta["Requires-Python"] == ">=3.9", "Requires-Python is %r" % meta["Requires-Python"]
          print("K6: Requires-Python", meta["Requires-Python"])
          PY
