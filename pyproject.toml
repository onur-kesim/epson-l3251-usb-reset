[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epson-usb"
dynamic = ["version"]
description = "USB (IEEE 1284.4 / D4) access to Epson printers: D4 session, EPSON-CTRL frames, EEPROM, status. Not affiliated with Seiko Epson."
readme = "epson_usb/README.md"
# 3.9 is the lowest Python the test suite is run on (CI job "3.9", K6 in
# KRITER_0.1.1.md). The code was never 3.10-only: 0.1.0 declared >=3.10 because
# that was the lowest version the suite had been run on, not because anything
# needs it (reported on epson_print_conf #35, issuecomment-5822154925).
requires-python = ">=3.9"
license = "MIT"
license-files = ["epson_usb/LICENSE"]
authors = [
    { name = "Onur Kesim" },
    { name = "Ircama" },
]
keywords = ["epson", "usb", "d4", "ieee-1284.4", "eeprom", "printer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: System :: Hardware :: Universal Serial Bus (USB) :: Printer",
]
# No runtime dependencies: the built-in `usbprint` (Windows), `libusb` (ctypes)
# and `raw` backends need nothing from PyPI. PyUSB is optional and only exists
# as the extra below (K5 in KRITER_0.1.1.md); the code and docstrings always
# described it that way, the 0.1.0 metadata did not.
#
# The host program `epson_print_conf` is deliberately NOT listed either: it is
# not on PyPI (404, measured 24 Sep 2026) and PyPI rejects direct URL
# dependencies. It is only needed to run seven of the test classes; CI installs
# it separately at a pinned commit (see .github/workflows/epson-usb.yml).
# K5 MUTANT (throw-away branch, never merged): the 0.1.0 defect is put back -
# PyUSB is a mandatory dependency again. The wheel then carries an
# unconditional `Requires-Dist: pyusb` and `pip install epson-usb` installs
# it, so the K5 step of the epson-usb workflow must be RED (KRITER_0.1.1.md K5).
dependencies = ["pyusb"]

[project.optional-dependencies]
pyusb = ["pyusb>=1.2"]

[project.urls]
Homepage = "https://github.com/onur-kesim/epson-l3251-usb-reset"
Issues = "https://github.com/onur-kesim/epson-l3251-usb-reset/issues"

[tool.setuptools.dynamic]
# epson_usb/__version__.py is the single source of truth; it is parsed, not
# imported, so building does not need the package's dependencies.
version = { attr = "epson_usb.__version__.__version__" }

[tool.setuptools.packages.find]
include = ["epson_usb", "epson_usb.*"]
# Real packages only (those with an __init__.py): epson_usb/examples/ is a
# demo script, not part of the library.
namespaces = false
# The tests (and the frozen reference copy of the standalone tool under
# tests/referans/) are not part of the distribution.
exclude = ["epson_usb.tests", "epson_usb.tests.*"]
